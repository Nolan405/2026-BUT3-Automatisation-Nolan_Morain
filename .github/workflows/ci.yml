name: CI

on:
  push:
    branches: [main, tp3-inspection]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restaurer les dépendances
        run: dotnet restore api.slnx

      - name: Compiler
        run: dotnet build api.slnx --no-restore --configuration Release

      - name: Vérifier le formatage
        run: dotnet format api.slnx --verify-no-changes

      - name: Test avec couverture
        run: >
          dotnet test api.slnx --no-restore --no-build --configuration Release 
          --results-directory ./TestResults --report-xunit-trx --coverage --coverage-output-format cobertura

      - name: Résumé de couverture
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          badge: true
          filename: ./**/*.cobertura.xml
          fail_below_min: true
          thresholds: '40 80'
          format: markdown
          output: both

      - name: Ajouter au résumé du run
        if: always()
        run: cat ../code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          # ../code-coverage-results.md si vous avez le working directory à backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: backend/TestResults/

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Installer les dépendances
        run: yarn install --immutable

      - name: Construire
        run: yarn build

      - name: Lint
        run: yarn run lint

      - name: Tester
        run: yarn test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-build-artifacts
          path: frontend/dist/

  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit npm
        working-directory: ./frontend
        run: corepack enable && yarn npm audit --severity high

      - name: Audit NuGet
        run: |
          OUTPUT=$(dotnet list backend/api.slnx package --vulnerable --include-transitive)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Ei "has the following vulnerable packages|(Critical|High)"; then
            echo "Vulnérabilités détectées !"
            exit 1
          fi

      - name: Construire l'image API
        run: docker build -t api:scan ./backend

      - name: Scanner l'image API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'api:scan'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Construire l'image web
        run: docker build -t web:scan ./frontend

      - name: Scanner l'image web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'web:scan'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
  
  publier:
    # needs: [api, front, securite] # Penser à le remettre à la fin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: docker.iut.arcanit.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publier l'API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            docker.iut.arcanit.io/${{ secrets.DOCKER_USER }}/api:${{ github.sha }}
            docker.iut.arcanit.io/${{ secrets.DOCKER_USER }}/api:main

      - name: Publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            docker.iut.arcanit.io/${{ secrets.DOCKER_USER }}/web:${{ github.sha }}
            docker.iut.arcanit.io/${{ secrets.DOCKER_USER }}/web:main

  deployer-test:
    needs: [publier]
    runs-on: ubuntu-latest
    steps:
      # Vous aurez besoin d'un -uses en plus ici à la fin du 4.3
    
      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VM_SSH_PORT }} -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Vérifier l'accès
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} -p ${{ secrets.VM_SSH_PORT }} \
            'docker version --format "{{.Server.Version}}"'
